# Kubernetes Configurations
Deployment, Service, Ingress for nation-scale deployment.

```yaml
# deployment.yaml stub
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rupaykg-core 
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: rupaykg-core
        image: rupaykg-os:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
```
