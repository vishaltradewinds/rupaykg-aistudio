name: One-Time Admin Auth Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-admin-auth-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair authentication path
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server.ts')
          text = path.read_text()

          old = 'const rawAdminPassword = process.env.ADMIN_PASSWORD || "admin123";'
          new = '''const rawAdminPassword = process.env.ADMIN_PASSWORD;
          if (!rawAdminPassword || rawAdminPassword.length < 16) {
            throw new Error("ADMIN_PASSWORD must be configured with at least 16 characters; insecure/default admin credentials are prohibited.");
          }'''
          if old not in text:
            raise SystemExit('Expected admin password fallback was not found; refusing an ambiguous edit.')
          text = text.replace(old, new, 1)

          # Login must be PostgreSQL-authoritative. Remove the legacy in-memory
          # fallback that could authenticate against a process-local seed.
          pattern = re.compile(
              r'''\n    if \(!user\) \{\n      if \(identifier === "admin"\) \{\n        user = users\.find\(\(u\) => u\.id === "admin_1" \|\| u\.uid === "admin_1" \|\| u\.email === "admin@rupaykg\.org"\);\n      \}\n      if \(!user\) \{\n        user = users\.find\(\n          \(u\) =>\n            u\.phone === identifier \|\|\n            u\.email === identifier \|\|\n            u\.uid === identifier \|\|\n            u\.id\?\.toString\(\) === identifier\n        \);\n      \}\n    \}\n''',
              re.MULTILINE,
          )
          text2, count = pattern.subn('\n', text, count=1)
          if count != 1:
            raise SystemExit(f'Expected legacy in-memory login fallback not found; refusing ambiguous edit (matches={count}).')
          text = text2

          path.write_text(text)

          test = Path('tests/admin_auth_contract_test.ts')
          test.write_text('''import fs from "fs";\n\nconst server = fs.readFileSync("server.ts", "utf8");\n\nif (server.includes('process.env.ADMIN_PASSWORD || "admin123"')) {\n  throw new Error("SECURITY REGRESSION: insecure admin password fallback remains");\n}\n\nif (!server.includes('ADMIN_PASSWORD must be configured with at least 16 characters')) {\n  throw new Error("SECURITY REGRESSION: production admin password requirement is missing");\n}\n\nif (/user = users\\.find\\(\\(u\\) => u\\.id === "admin_1"/.test(server)) {\n  throw new Error("SECURITY REGRESSION: in-memory admin login fallback remains");\n}\n\nconsole.log("ADMIN_AUTH_CONTRACT: PASS");\n''')

      - name: Run admin auth contract test
        run: npx tsx tests/admin_auth_contract_test.ts

      - name: Commit repaired authentication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts tests/admin_auth_contract_test.ts
          git commit -m "security: require configured admin password and DB-authoritative login"
          git push

      - name: Remove one-time repair workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-admin-auth-repair.yml
          git commit -m "chore: remove one-time admin auth repair workflow"
          git push
