name: RupayKg CCTS + GCP Combined Regression

on:
  push:
    branches:
      - recovery/gcp-ccts-checkpoint-20260830
  workflow_dispatch:

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rupaykg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rupaykg
      SQL_HOST: 127.0.0.1
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_DB_NAME: rupaykg
      SQL_PORT: 5432
      DB_SSL: "false"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Full existing regression
        run: npm test
      - name: Explicit combined CCTS + GCP lifecycle gate
        run: npx tsx tests/gcp_ccts_combined_regression_test.ts
      - name: GCP sandbox contract E2E gate
        run: npm run test:gcp:sandbox:e2e
