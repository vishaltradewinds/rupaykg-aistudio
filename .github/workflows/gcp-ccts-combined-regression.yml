name: RupayKg CCTS + GCP Combined Regression

on:
  push:
    branches:
      - recovery/gcp-ccts-checkpoint-20260830
  workflow_dispatch:

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Full existing regression
        run: npm test
      - name: Explicit combined CCTS + GCP lifecycle gate
        run: npx tsx tests/gcp_ccts_combined_regression_test.ts
