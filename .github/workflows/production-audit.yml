name: RupayKg Production Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile if package manifest changed
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Lint / Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Domain and persistence tests
        run: npm test
      - name: P0 security tests
        run: npm run test:p0
      - name: P1 regression tests
        run: npm run test:p1
      - name: P2 adversarial security tests
        run: npm run test:p2
      - name: Production certification tests
        run: npm run test:cert
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lock [skip ci]"
          git push
