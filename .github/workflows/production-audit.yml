name: RupayKg Production Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SQL_HOST: localhost
      SQL_ADMIN_USER: postgres
      SQL_ADMIN_PASSWORD: postgres
      SQL_DB_NAME: rupaykg
      SQL_PORT: 5432
      HEDERA_NETWORK: testnet
      HEDERA_TOPIC_ID: 0.0.12345
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply UI consolidation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/App.tsx")
          text = path.read_text()
          banner = '''        <div className="mx-1 rounded-lg border border-amber-500/20 bg-amber-500/5 px-3 py-2" role="status" aria-label="LGD verification status">
            <div className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-wider text-amber-300">
              <ShieldAlert size={13} />
              LGD: Local Index
            </div>
            <p className="mt-0.5 text-[9px] leading-4 text-white/40">
              Not Government Verified. Use official LGD data for regulatory submissions.
            </p>
          </div>'''
          if "LGD: Local Index" not in text:
              anchor = '        </div>\n\n        <div className="flex-1 flex flex-col gap-2 overflow-y-auto pr-2 pb-4 [&::-webkit-scrollbar]:w-1 [&::-webkit-scrollbar-thumb]:bg-white/10 [&::-webkit-scrollbar-thumb]:rounded-full">'
              if anchor not in text: raise SystemExit("UI patch anchor not found: sidebar context toggle")
              text = text.replace(anchor, '        </div>\n\n' + banner + '\n\n        <div className="flex-1 flex flex-col gap-2 overflow-y-auto pr-2 pb-4 [&::-webkit-scrollbar]:w-1 [&::-webkit-scrollbar-thumb]:bg-white/10 [&::-webkit-scrollbar-thumb]:rounded-full">', 1)
          if "            Workspace\n" not in text:
              marker = '          {/* Core Operating System Engines */}'
              if marker not in text: raise SystemExit("UI patch anchor not found: core engines")
              text = text.replace(marker, '          <div className="px-2 pt-1 pb-0.5 text-[9px] font-extrabold uppercase tracking-[0.18em] text-white/30">\n            Workspace\n          </div>\n          {/* Core Operating System Engines */}', 1)
          if "            Field Operations\n" not in text:
              marker = "          {(user?.role === 'citizen' || user?.role === 'fpo' || ['industry_generator', 'commercial_generator', 'institution_generator', 'municipal_generator', 'industry', 'commercial', 'institution', 'municipality'].includes(user?.role || '')) && ("
              if marker not in text: raise SystemExit("UI patch anchor not found: field operations")
              text = text.replace(marker, '          <div className="px-2 pt-2 pb-0.5 text-[9px] font-extrabold uppercase tracking-[0.18em] text-white/30">\n            Field Operations\n          </div>\n\n' + marker, 1)
          if "            Administration\n" not in text:
              marker = '          {/* Grouped Platform Options & Utilities Menu */}'
              if marker not in text: raise SystemExit("UI patch anchor not found: administration")
              text = text.replace(marker, '          <div className="px-2 pt-2 pb-0.5 text-[9px] font-extrabold uppercase tracking-[0.18em] text-white/30">\n            Administration\n          </div>\n\n          {/* Grouped Platform Options & Utilities Menu */}', 1)
          path.write_text(text)
          print("UI consolidation present:", all(x in text for x in ["LGD: Local Index", "Workspace", "Field Operations", "Administration"]))
          PY
          git diff --check
      - name: Regenerate lockfile if package manifest changed
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Lint / Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Generate ephemeral RSA files for CI security tests
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
          openssl rsa -pubout -in private.pem -out public.pem
          chmod 600 private.pem public.pem
      - name: Domain and persistence tests
        run: npm test
      - name: P0 security tests
        run: npm run test:p0
      - name: P1 regression tests
        run: npm run test:p1
      - name: Generate ephemeral VC signing keys for certification
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/vc_private.pem
          openssl rsa -pubout -in /tmp/vc_private.pem -out /tmp/vc_public.pem
          while IFS= read -r line; do echo "::add-mask::$line"; done < /tmp/vc_private.pem
          while IFS= read -r line; do echo "::add-mask::$line"; done < /tmp/vc_public.pem
          {
            echo 'VC_ISSUER_PRIVATE_KEY<<RUPAYKG_VC_EOF'
            cat /tmp/vc_private.pem
            echo 'RUPAYKG_VC_EOF'
            echo 'VC_ISSUER_PUBLIC_KEY<<RUPAYKG_VC_EOF'
            cat /tmp/vc_public.pem
            echo 'RUPAYKG_VC_EOF'
            echo 'VC_ISSUER_DID=did:rupaykg:ci'
          } >> "$GITHUB_ENV"
          chmod 600 /tmp/vc_private.pem /tmp/vc_public.pem
      - name: P2 adversarial security tests
        run: npm run test:p2
      - name: Production certification tests
        run: npm run test:cert
      - name: Remove ephemeral CI keys
        if: always()
        run: rm -f private.pem public.pem /tmp/vc_private.pem /tmp/vc_public.pem
      - name: Commit tested UI consolidation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- package-lock.json
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No UI changes to commit; repository already contains the consolidated UI."
            exit 0
          fi
          git diff --cached --check
          git commit -m "refactor: consolidate UI navigation and LGD status [skip ci]"
          git push
