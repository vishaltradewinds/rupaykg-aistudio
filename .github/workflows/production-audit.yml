name: RupayKg Production Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Production-audit checkpoint for the DB-authoritative admin authentication path.
# The authentication smoke test intentionally starts with an empty users table so
# the runtime bootstrap path is exercised rather than hidden by CI pre-seeding.
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SQL_HOST: localhost
      SQL_ADMIN_USER: postgres
      SQL_ADMIN_PASSWORD: postgres
      SQL_DB_NAME: rupaykg
      SQL_PORT: 5432
      HEDERA_NETWORK: testnet
      HEDERA_TOPIC_ID: 0.0.12345
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile in CI workspace
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Lint / Typecheck
        run: npm run lint
      - name: Admin authentication contract test
        run: npx tsx tests/admin_auth_contract_test.ts
      - name: Consolidation call-graph check
        run: npm run test:consolidation
      - name: Production build
        run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Generate ephemeral RSA files for CI security tests
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
          openssl rsa -pubout -in private.pem -out public.pem
          chmod 600 private.pem public.pem
      - name: Generate CI admin password
        run: |
          set -euo pipefail
          CI_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "CI_ADMIN_PASSWORD=${CI_ADMIN_PASSWORD}" >> "$GITHUB_ENV"
      - name: Admin authentication smoke test from empty users table
        run: |
          set -euo pipefail
          export ADMIN_PASSWORD="${CI_ADMIN_PASSWORD}"
          export NODE_ENV=test
          node dist/server.cjs > /tmp/rupaykg-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            cat /tmp/rupaykg-server.log || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/readiness >/tmp/readiness.json; then
              break
            fi
            sleep 1
          done

          curl -fsS -X POST http://127.0.0.1:3000/api/login \
            -H 'Content-Type: application/json' \
            --data "{\"loginId\":\"admin\",\"password\":\"${CI_ADMIN_PASSWORD}\"}" \
            >/tmp/admin-login.json

          node - <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('/tmp/admin-login.json', 'utf8'));
          if (!response.token || response.user?.role !== 'super_admin' || response.user?.uid !== 'admin_1') {
            console.error('ADMIN AUTH SMOKE TEST FAILED:', response);
            process.exit(1);
          }
          console.log('ADMIN AUTH SMOKE TEST PASSED: empty DB bootstrap -> admin_1 / super_admin');
          NODE
      - name: Domain and persistence tests
        run: npm test
      - name: P0 security tests
        run: npm run test:p0
      - name: P1 regression tests
        run: npm run test:p1
      - name: Generate ephemeral VC signing keys for certification
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/vc_private.pem
          openssl rsa -pubout -in /tmp/vc_private.pem -out /tmp/vc_public.pem
          while IFS= read -r line; do echo "::add-mask::$line"; done < /tmp/vc_private.pem
          while IFS= read -r line; do echo "::add-mask::$line"; done < /tmp/vc_public.pem
          {
            echo 'VC_ISSUER_PRIVATE_KEY<<RUPAYKG_VC_EOF'
            cat /tmp/vc_private.pem
            echo 'RUPAYKG_VC_EOF'
            echo 'VC_ISSUER_PUBLIC_KEY<<RUPAYKG_VC_EOF'
            cat /tmp/vc_public.pem
            echo 'RUPAYKG_VC_EOF'
            echo 'VC_ISSUER_DID=did:rupaykg:ci'
          } >> "$GITHUB_ENV"
          chmod 600 /tmp/vc_private.pem /tmp/vc_public.pem
      - name: P2 adversarial security tests
        run: npm run test:p2
      - name: Production certification tests
        run: npm run test:cert
      - name: Remove ephemeral CI keys
        if: always()
        run: rm -f private.pem public.pem /tmp/vc_private.pem /tmp/vc_public.pem
