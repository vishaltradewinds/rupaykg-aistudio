name: RupayKg Production Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SQL_HOST: localhost
      SQL_ADMIN_USER: postgres
      SQL_ADMIN_PASSWORD: postgres
      SQL_DB_NAME: rupaykg
      SQL_PORT: 5432
      HEDERA_NETWORK: testnet
      HEDERA_TOPIC_ID: 0.0.12345
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile if package manifest changed
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Lint / Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Generate ephemeral RSA files for CI security tests
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
          openssl rsa -pubout -in private.pem -out public.pem
          chmod 600 private.pem public.pem
      - name: Domain and persistence tests
        run: npm test
      - name: P0 security tests
        run: npm run test:p0
      - name: P1 regression tests
        run: npm run test:p1
      - name: Generate ephemeral VC signing keys for certification
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/vc_private.pem
          openssl rsa -pubout -in /tmp/vc_private.pem -out /tmp/vc_public.pem
          while IFS= read -r line; do echo "::add-mask::$line"; done < /tmp/vc_private.pem
          while IFS= read -r line; do echo "::add-mask::$line"; done < /tmp/vc_public.pem
          {
            echo 'VC_ISSUER_PRIVATE_KEY<<RUPAYKG_VC_EOF'
            cat /tmp/vc_private.pem
            echo 'RUPAYKG_VC_EOF'
            echo 'VC_ISSUER_PUBLIC_KEY<<RUPAYKG_VC_EOF'
            cat /tmp/vc_public.pem
            echo 'RUPAYKG_VC_EOF'
            echo 'VC_ISSUER_DID=did:rupaykg:ci'
          } >> "$GITHUB_ENV"
          chmod 600 /tmp/vc_private.pem /tmp/vc_public.pem
      - name: P2 adversarial security tests
        run: npm run test:p2
      - name: Production certification tests
        run: npm run test:cert
      - name: Remove ephemeral CI keys
        if: always()
        run: rm -f private.pem public.pem /tmp/vc_private.pem /tmp/vc_public.pem
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lock [skip ci]"
          git push
