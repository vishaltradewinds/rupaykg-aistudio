name: RupayKg CCTS E2E Adversarial

on:
  push:
    branches:
      - feat/environmental-credit-depository
  workflow_dispatch:

jobs:
  ccts-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Run CCTS end-to-end adversarial suite
        run: npm run test:environmental:e2e
