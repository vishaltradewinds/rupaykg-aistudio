name: Surgical Carbon Migration

on:
  push:
    branches:
      - cleanup/carbon-boundary-20260830

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/carbon-boundary-20260830
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply surgical EnterpriseSuite patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/EnterpriseSuite.tsx')
          s = p.read_text()

          old_import = "import {\n  enterpriseMrvService,\n  enterpriseStore\n} from '../services/enterpriseMrvService';\n"
          new_import = old_import + "import { canonicalCarbonBoundary } from '../services/canonicalCarbonBoundary';\n"
          if "canonicalCarbonBoundary" not in s:
              if old_import not in s:
                  raise SystemExit('Expected EnterpriseSuite service import block not found; refusing to patch')
              s = s.replace(old_import, new_import, 1)

          old_handler = '''  // 9. Run Local Calculation Trace\n  const handleExecuteTrace = (eventId: string) => {\n    try {\n      const run = enterpriseMrvService.calculateCarbonReductions(selectedProjectId, eventId, selectedMethodologyId);\n      setSelectedCalculationRun(run);\n      loadAllStates();\n    } catch (e: any) {\n      alert(e.message);\n    }\n  };'''
          new_handler = '''  // 9. Run Carbon Intelligence Trace through the canonical server boundary.\n  const handleExecuteTrace = async (eventId: string) => {\n    try {\n      const event = mrvEvents.find(candidate => candidate.eventId === eventId);\n      await canonicalCarbonBoundary.quantify({\n        activityData: {\n          projectId: selectedProjectId,\n          eventId,\n          methodologyId: selectedMethodologyId,\n          operatingMode,\n          ...(event ? { event } : {}),\n        },\n      });\n\n      // Compatibility read-model only: the legacy calculation is retained temporarily\n      // so the existing trace UI remains populated while the server boundary becomes\n      // the execution gate. It is not treated as authoritative issuance/custody state.\n      const run = enterpriseMrvService.calculateCarbonReductions(selectedProjectId, eventId, selectedMethodologyId);\n      setSelectedCalculationRun(run);\n      loadAllStates();\n    } catch (e: any) {\n      alert(e.message);\n    }\n  };'''
          if old_handler in s:
              s = s.replace(old_handler, new_handler, 1)
          elif 'const handleExecuteTrace = async (eventId: string)' not in s:
              raise SystemExit('Expected Carbon Trace handler not found; refusing to patch')

          p.write_text(s)
          PY

      - name: Assert surgical diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/components/EnterpriseSuite.tsx
          test "$(git diff --numstat -- src/components/EnterpriseSuite.tsx | awk '{print $1+$2}')" -le 30

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Full CCTS + GCP regression
        run: npm test

      - name: Commit only after all verification passes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/EnterpriseSuite.tsx; then
            echo 'EnterpriseSuite patch already present; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/EnterpriseSuite.tsx
          git commit -m 'refactor(carbon): route EnterpriseSuite trace through canonical boundary'
          git push origin HEAD:cleanup/carbon-boundary-20260830
