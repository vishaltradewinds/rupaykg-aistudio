name: One-time LGD hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message != 'security: harden LGD verification boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Make LGD verification fail closed
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('server.ts')
          s = p.read_text()
          pattern = r'function getLGDInfo\(state: string, district: string, localArea: string, context = [\'\"]Urban[\'\"], subdistrict\?: string\) \{.*?\n\}\n\napp\.set\("trust proxy", 1\);'
          replacement = '''function getLGDInfo(state: string, district: string, localArea: string, context = 'Urban', subdistrict?: string) {
            // LGD is a government-authority boundary. The application dataset is a local index only.
            // Never manufacture or label locally derived identifiers as official LGD codes.
            const states = getLgdStates();
            const stateRecord = states.find((row) => row.state_name === state || String(row.state_lgd_code) === state);
            if (!stateRecord) return null;

            const districtRows = getLgdDistricts(stateRecord.state_name);
            const districtRecord = districtRows.find((row) => row.district_name === district);
            if (!districtRecord) return null;

            return {
              state_name: stateRecord.state_name,
              state_lgd_code: stateRecord.state_lgd_code,
              district_name: districtRecord.district_name,
              district_lgd_code: districtRecord.district_lgd_code,
              subdistrict_name: subdistrict || null,
              subdistrict_lgd_code: null,
              local_body_name: localArea || null,
              local_body_lgd_code: null,
              local_body_type: (context === 'Rural' || context === 'rural') ? 'Gram Panchayat' : 'Local Body',
              ward_or_village_name: localArea || null,
              ward_or_village_lgd_code: null,
              census_2011_code: null,
              is_lgd_verified: false,
              verification_source: 'Local application index — not authoritative LGD',
              last_synced_at: null,
            };
          }'''
          if not re.search(pattern, s, flags=re.S):
              raise SystemExit('Target getLGDInfo function not found; refusing to modify server.ts')
          s = re.sub(pattern, replacement + '\n\napp.set("trust proxy", 1);', s, count=1, flags=re.S)
          p.write_text(s)
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/one-time-lgd-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts .github/workflows/one-time-lgd-hardening.yml
          git commit -m 'security: harden LGD verification boundary'
          git push
