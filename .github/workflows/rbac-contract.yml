name: RBAC Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rbac-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: RBAC contract
        run: npx tsx tests/rbac_contract_test.ts
